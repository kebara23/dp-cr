services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dpcr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dpcr
      POSTGRES_PASSWORD: dpcr
      POSTGRES_DB: dpcr
    ports:
      - "5432:5432"
    volumes:
      - dpcr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpcr -d dpcr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dpcr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dpcr-redisdata:/data

volumes:
  dpcr-pgdata:
  dpcr-redisdata:
